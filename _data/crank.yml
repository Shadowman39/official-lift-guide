  - name: Ladder Lift
    author: "[Thibault Art](https://www.instructables.com/member/Thibault+Art/)"
    featured: "[The Exception](https://www.youtube.com/watch?v=Fdu4TbQtr40)"
    category: main
    video: https://www.youtube.com/watch?v=PaPyeSlT7Y0
    instructions: https://www.instructables.com/id/knex-ladder-lift/
    description: This is a bit similar to jigsaw lifts, except the balls go inside of the rotating carrier instead of along the side, which is where it gets the name "Ladder Lift". It is also different in the way the balls are stored for each rotation, inside of the tower structure itself.
