  - name: Alternating Jigsaw Lift
    author: "[Thibault Art](https://www.instructables.com/member/Thibault%20Art/)"
    featured: 
    category: main
    video: https://youtu.be/2CgSedctTpo?t=87
    instructions: https://www.instructables.com/Knex-Ball-Machine-Lift-Dubble-Stair-Lift/
    description:  The balls in this lift alternate from one jigsaw to the other, with both jigsaws placed opposite each other on crankshafts. They rotate in reverse compared to a normal jigsaw, which lets the balls switch to the other side only when they are lifted above the middle wall.
