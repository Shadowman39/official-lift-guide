  - name: Double Ladder Lift
    author: "[Thibault Art](https://www.instructables.com/member/Thibault%20Art/)"
    featured: "[Turbion](https://www.youtube.com/watch?v=Cnew_BAvNo4)"
    category: ladder lift
    video: https://youtu.be/Pbak7IOwSGM?t=33
    instructions: 
    description:  Like jigsaws, ladder lifts can also be made with two carriers instead of one. Rather than balls waiting on a fixed ladder for the rotating one to come around again, they switch beteen two that are in opposite rotation angles. This is a bit more complicated than a normal ladder lift, since the two carriers have to be hooked up on double cranks, but it's more interesting and removes the need for a counterweight.
